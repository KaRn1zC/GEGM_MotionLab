# =============================================================================
# Comfy_Img_to_Loop - Configuration NATIVE ComfyUI (URLs DÉFINITIVES)
# Version: 1.0.2
# Date: 2025-09-19
# Description: Support natif ComfyUI + téléchargement automatique via custom nodes
# =============================================================================

config_version: "1.0.2"
last_updated: "2025-09-19"
description: "Configuration utilisant le support natif ComfyUI et auto-download"
strategy: "native_comfyui_auto_download"

# Configuration ComfyUI (version avec support natif WAN 2.2)
comfyui:
  version: "latest"  # Support natif WAN 2.2 depuis juillet 2025
  repository: "https://github.com/comfyanonymous/ComfyUI.git"
  branch: "master"
  description: "ComfyUI avec support natif WAN 2.2 (pas besoin de wrapper externe)"
  native_support: true
  wan_22_support: true

# Configuration des modèles - Téléchargement via huggingface-cli
models:
  # WAN 2.2 I2V - Via téléchargement officiel Hugging Face
  wan_2_2_i2v_14b:
    name: "WAN 2.2 Image-to-Video 14B"
    repository: "Wan-AI/Wan2.2-I2V-A14B"
    download_method: "huggingface_cli"
    download_command: 'huggingface-cli download Wan-AI/Wan2.2-I2V-A14B --local-dir models/wan2.2-i2v-a14b'
    version: "2.2.0"
    model_type: "image_to_video"
    vram_requirement: "24GB+"
    destination: "models/wan2.2-i2v-a14b/"
    file_size_gb: 27.8
    description: "Modèle principal WAN 2.2 pour Image-to-Video (support natif ComfyUI)"
    comfyui_path: "diffusion_models"

  # WAN 2.2 T2V (optionnel pour text-to-video)
  wan_2_2_t2v_14b:
    name: "WAN 2.2 Text-to-Video 14B" 
    repository: "Wan-AI/Wan2.2-T2V-A14B"
    download_method: "huggingface_cli"
    download_command: 'huggingface-cli download Wan-AI/Wan2.2-T2V-A14B --local-dir models/wan2.2-t2v-a14b'
    version: "2.2.0"
    model_type: "text_to_video"
    vram_requirement: "24GB+"
    destination: "models/wan2.2-t2v-a14b/"
    file_size_gb: 27.8
    description: "Modèle WAN 2.2 pour Text-to-Video (optionnel)"
    optional: true

  # WAN 2.2 5B - Version allégée
  wan_2_2_ti2v_5b:
    name: "WAN 2.2 TI2V 5B Dense"
    repository: "Wan-AI/Wan2.2-TI2V-5B"
    download_method: "huggingface_cli"
    download_command: 'huggingface-cli download Wan-AI/Wan2.2-TI2V-5B --local-dir models/wan2.2-ti2v-5b'
    version: "2.2.0"
    model_type: "text_image_to_video"
    vram_requirement: "12GB+"
    destination: "models/wan2.2-ti2v-5b/"
    file_size_gb: 9.4
    description: "Version 5B allégée avec VAE haute compression (recommandée pour débuter)"
    recommended: true

# Custom nodes - Auto-download des modèles
custom_nodes:
  # Auto Download Models (téléchargement automatique)
  auto_download_models:
    name: "ComfyUI-AutoDownloadModels"
    repository: "https://github.com/ltdrdata/ComfyUI-Manager.git"
    version: "main"
    destination: "custom_nodes/ComfyUI_AutoDownloadModels"
    description: "Téléchargement automatique des modèles WAN via interface ComfyUI"
    auto_download: true
    supported_repos: 
      - "Kijai/WanVideo_comfy"
      - "alibabaai/W2.2-Fun-1.3B-Control"
      - "Comfy-Org/W_2.1_ComfyUI_repackaged"

  # WAN Video Wrapper (backup)
  wan_video_wrapper:
    name: "ComfyUI-WanVideoWrapper"
    repository: "https://github.com/kijai/ComfyUI-WanVideoWrapper.git"
    version: "main"
    destination: "custom_nodes/ComfyUI-WanVideoWrapper"
    description: "Wrapper pour WAN (backup - pas nécessaire avec support natif)"
    required: false

  # Pyramid Flow Wrapper
  pyramid_flow_wrapper:
    name: "ComfyUI-PyramidFlowWrapper"
    repository: "https://github.com/kijai/ComfyUI-PyramidFlowWrapper.git"
    version: "main" 
    destination: "custom_nodes/ComfyUI-PyramidFlowWrapper"
    description: "Support Pyramid Flow pour upscaling vidéo"
    required: true

# Pyramid Flow - Via custom node auto-download
pyramid_flow:
  download_method: "custom_node_auto"
  description: "Téléchargé automatiquement par le PyramidFlowWrapper"
  models:
    - "pyramid_flow_sd3.safetensors"
    - "pyramid_flow_vae.safetensors"

# Configuration des chemins ComfyUI
comfyui_paths:
  base: "models"
  checkpoints: "checkpoints" 
  diffusion_models: "diffusion_models"
  vae: "vae"
  text_encoders: "text_encoders"
  custom_nodes: "custom_nodes"

# Installation et setup
installation:
  dependencies:
    - name: "huggingface_hub[cli]"
      install_command: 'pip install "huggingface_hub[cli]"'
      description: "CLI Hugging Face pour téléchargement officiel"
    - name: "ComfyUI Manager"
      install_method: "manual"
      description: "Manager pour installation custom nodes"
      
  setup_steps:
    1: "Installer ComfyUI latest (support natif WAN 2.2)"
    2: "Installer huggingface-cli"
    3: "Installer ComfyUI Manager"
    4: "Cloner custom nodes auto-download"
    5: "Utiliser l'interface pour télécharger WAN 2.2"

# Commandes de téléchargement direct
download_commands:
  wan_2_2_i2v: 'huggingface-cli download Wan-AI/Wan2.2-I2V-A14B --local-dir ./models/wan2.2-i2v-a14b'
  wan_2_2_5b: 'huggingface-cli download Wan-AI/Wan2.2-TI2V-5B --local-dir ./models/wan2.2-ti2v-5b'
  
# Configuration par défaut de génération
runtime_config:
  default_model: "wan_2_2_ti2v_5b"  # Version 5B recommandée pour commencer
  default_resolution: "480p"
  default_fps: 24
  default_duration_seconds: 5
  
# Notes importantes
notes:
  - "ComfyUI a un support NATIF pour WAN 2.2 depuis juillet 2025"
  - "Pas besoin de custom wrappers - utiliser les nodes natifs"
  - "Téléchargement via huggingface-cli officiel"
  - "Custom node auto-download comme alternative"
  - "Commencer avec le modèle 5B (12GB VRAM) puis upgrader vers 14B"
  - "Support commercial Apache 2.0"

workflow_examples:
  basic_i2v: "Utiliser 'WAN Diffusion Model Loader' natif + 'WAN Sampler'"
  with_upscale: "Chain WAN + Pyramid Flow pour upscaling"
  cinemagraph: "High noise variant pour animations dynamiques"
