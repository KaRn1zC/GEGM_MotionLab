# =============================================================================
# Registre central des modèles — source de vérité unique
# Version: 1.0.0
# Date: 2026-03-16
#
# Ajouter un nouveau modèle = 1 entrée ici + 1 template workflow JSON.
# Zéro modification Python/bash/Makefile.
# =============================================================================

models:
  wan2.2-ti2v-5b:
    display_name: "WAN 2.2 TI2V 5B"
    model_type: "5b"
    architecture: "dense"
    hf_repo: "Comfy-Org/Wan_2.2_ComfyUI_Repackaged"
    vram_requirement: "48GB+"
    estimated_time: "~8 min"

    runtime:
      timeout_seconds: 5400
      max_frames: 240
      max_fps: 60

    diffusion_files:
      - filename: "wan2.2_ti2v_5B_fp16.safetensors"
        hf_path: "split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors"
        comfyui_subdir: "diffusion_models"
        size_bytes: 9999658848
        min_size_gb: 8.0
        max_size_gb: 11.0
        role: null

    vae:
      filename: "wan2.2_vae.safetensors"
      hf_path: "split_files/vae/wan2.2_vae.safetensors"
      expected_channels: 48
      min_size_gb: 0.5
      max_size_gb: 2.0
      version: "2.2"

    checkpoint_detection:
      primary_files:
        - "wan2.2_ti2v_5B_fp16.safetensors"
      fallback_files:
        - "diffusion_pytorch_model.safetensors"
      return_type: "single"

    resolution:
      max_width: 1280
      max_height: 720
      dimension_stride: 32
      upscale_trigger_ratio: 1.5
      supersampling_max_ratio: 4.0
      vae_tiling_pixel_threshold: 2073600   # 1920×1080
      vae_tiling_upscale_threshold: 4.0

    workflow_template: "wan22_5b_i2v"
    workflow_template_upscale: "wan22_5b_with_upscale"

    verification:
      diffusion_keys:
        - "blocks.0.ffn.0.weight"
        - "blocks.14.ffn.0.weight"
        - "blocks.23.ffn.0.weight"
      vae_keys:
        - "conv1.bias"
        - "conv2.bias"
        - "conv2.weight"
        - "decoder.conv1.bias"
        - "decoder.conv1.weight"
        - "encoder.conv1.bias"
        - "encoder.conv1.weight"

    symlinks:
      - source: "../diffusion_models/wan2.2_ti2v_5B_fp16.safetensors"
        target: "wan2.2_ti2v_5B_fp16.safetensors"
      - source: "../text_encoders/umt5_xxl_fp16.safetensors"
        target: "umt5_xxl_fp16.safetensors"
      - source: "../vae/wan2.2_vae.safetensors"
        target: "wan2.2_vae.safetensors"

