    runtime:
      timeout_seconds: 10800
      max_frames: 240
      max_fps: 60

    diffusion_files:
      - filename: "wan2.2_i2v_high_noise_14B_fp16.safetensors"
        hf_path: "split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors"
        comfyui_subdir: "diffusion_models"
        size_bytes: 30706966480
        min_size_gb: 25.0
        max_size_gb: 32.0
        role: "high_noise"
      - filename: "wan2.2_i2v_low_noise_14B_fp16.safetensors"
        hf_path: "split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors"
        comfyui_subdir: "diffusion_models"
        size_bytes: 30706966480
        min_size_gb: 25.0
        max_size_gb: 32.0
        role: "low_noise"

    vae:
      filename: "wan_2.1_vae.safetensors"
      hf_path: "split_files/vae/wan_2.1_vae.safetensors"
      expected_channels: 16
      min_size_gb: 0.2
      max_size_gb: 0.4
      version: "2.1"

    checkpoint_detection:
      primary_files:
        - "wan2.2_i2v_high_noise_14B_fp16.safetensors"
        - "wan2.2_i2v_low_noise_14B_fp16.safetensors"
      fallback_files:
        - "diffusion_pytorch_model.safetensors"
      return_type: "moe_pair"

    resolution:
      max_width: 1280
      max_height: 720
      dimension_stride: 32
      upscale_trigger_ratio: 1.5
      supersampling_max_ratio: 4.0
      vae_tiling_pixel_threshold: 2073600   # 1920×1080
      vae_tiling_upscale_threshold: 4.0

    workflow_template: "wan22_14b_i2v"
    workflow_template_upscale: "wan22_14b_with_upscale"

    verification:
      diffusion_keys:
        - "blocks.0.ffn.0.weight"
        - "blocks.14.ffn.0.weight"
        - "blocks.23.ffn.0.weight"
      vae_keys:
        - "conv1.bias"
        - "conv2.bias"
        - "conv2.weight"
        - "decoder.conv1.bias"
        - "decoder.conv1.weight"
        - "encoder.conv1.bias"
        - "encoder.conv1.weight"

    symlinks:
      - source: "../diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors"
        target: "wan2.2_i2v_high_noise_14B_fp16.safetensors"
      - source: "../diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors"
        target: "wan2.2_i2v_low_noise_14B_fp16.safetensors"
      - source: "../text_encoders/umt5_xxl_fp16.safetensors"
        target: "umt5_xxl_fp16.safetensors"
      - source: "../vae/wan_2.1_vae.safetensors"
        target: "wan_2.1_vae.safetensors"

  # =========================================================================
  # LTX 2.3 — DiT 22B, Gemma 3 12B encoder, boucle native LTXVLoopingSampler
  # =========================================================================

  ltx-2.3-i2v-distilled:
    display_name: "LTX 2.3 I2V Distilled (FP8)"
    model_type: "distilled"
    architecture: "dit"
    hf_repo: "Lightricks/LTX-2.3-fp8"
    vram_requirement: "48GB+"
    estimated_time: "~2 min"

    runtime:
      timeout_seconds: 3600
      max_frames: 241       # LTX: N*8+1 (max 241 = 30s @ 8fps)
      max_fps: 50

    resolution:
      max_width: 1920
      max_height: 1088       # 1080 arrondi au multiple de 32 supérieur
      dimension_stride: 32
      upscale_trigger_ratio: 1.3
      supersampling_max_ratio: 4.0
      vae_tiling_pixel_threshold: 4147200   # ~2560×1620
      vae_tiling_upscale_threshold: 3.0

    diffusion_files:
      - filename: "ltx-2.3-22b-distilled-fp8.safetensors"
        hf_path: "ltx-2.3-22b-distilled-fp8.safetensors"
        comfyui_subdir: "checkpoints"
        size_bytes: 31675810816   # ~29.5 GB
        min_size_gb: 28.0
        max_size_gb: 32.0
        role: null

    text_encoder:
      filename: "gemma_3_12B_it_fp8_scaled.safetensors"
      hf_repo: "Comfy-Org/ltx-2"
      hf_path: "split_files/text_encoders/gemma_3_12B_it_fp8_scaled.safetensors"
      comfyui_subdir: "text_encoders"
      size_bytes: 14177222656   # ~13.2 GB

    vae:
      filename: "integrated"   # VAE intégré dans le checkpoint
      hf_path: ""
      expected_channels: 128
      min_size_gb: 0
      max_size_gb: 0
      version: "2.3"

    checkpoint_detection:
      primary_files:
        - "ltx-2.3-22b-distilled-fp8.safetensors"
      fallback_files: []
      return_type: "single"

    workflow_template: "ltx23_i2v"
    workflow_template_upscale: "ltx23_i2v_with_upscale"

    verification:
      diffusion_keys: []     # À compléter après test avec le modèle réel
      vae_keys: []

    symlinks: []

  ltx-2.3-i2v-dev:
