# Composants partagés entre tous les modèles
shared_components:
  text_encoder:
    filename: "umt5_xxl_fp16.safetensors"
    hf_repo: "Comfy-Org/Wan_2.2_ComfyUI_Repackaged"
    hf_path: "split_files/text_encoders/umt5_xxl_fp16.safetensors"
    comfyui_subdir: "text_encoders"
    size_bytes: 12243436880
    min_size_gb: 10.0
    max_size_gb: 13.0
    critical_keys:
      - "shared.weight"
      - "encoder.block.0.layer.0.SelfAttention.q.weight"
      - "encoder.block.0.layer.1.DenseReluDense.wi_0.weight"
      - "encoder.block.0.layer.1.DenseReluDense.wi_1.weight"
      - "encoder.block.0.layer.1.DenseReluDense.wo.weight"
      - "encoder.block.11.layer.1.DenseReluDense.wi_0.weight"
      - "encoder.block.23.layer.0.SelfAttention.q.weight"
      - "encoder.block.23.layer.1.DenseReluDense.wo.weight"
      - "encoder.final_layer_norm.weight"

  clip_vision:
    filename: "clip-vit-large-patch14-336.safetensors"
    url: "https://huggingface.co/h94/IP-Adapter/resolve/main/models/image_encoder/model.safetensors"
    comfyui_subdir: "clip_vision"
    size_bytes: 2528373760

  upscalers:
    - filename: "4x-UltraSharp.pth"
      url: "https://huggingface.co/lokCX/4x-Ultrasharp/resolve/main/4x-UltraSharp.pth"
      comfyui_subdir: "upscale_models"
      optional: false
    - filename: "RealESRGAN_x4plus.pth"
      url: "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth"
      comfyui_subdir: "upscale_models"
      optional: true

# Ordre de priorité pour la détection automatique (LTX dev > LTX distilled > WAN 14B > WAN 5B)
detection_priority:
  - "ltx-2.3-i2v-dev"
  - "ltx-2.3-i2v-distilled"
  - "wan2.2-i2v-a14b"
  - "wan2.2-ti2v-5b"
